[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "cp prisma/schema.production.prisma prisma/schema.prisma",
  "npx prisma generate",
  "npm run build",
  "npx prisma migrate deploy",
  "npx prisma db seed"
]

[start]
cmd = "node dist/server.js"
